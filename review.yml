name: Review from dashboard

# The dashboard's Approve and Reject buttons open a GitHub issue titled
# "approve ITEM-ID" or "reject ITEM-ID". When the repository owner submits it,
# this workflow applies the decision, saves the data, and closes the issue.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  review:
    # Only the repository owner's requests are acted on.
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, 'approve ') || startsWith(github.event.issue.title, 'reject '))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply decision
        env:
          TITLE: ${{ github.event.issue.title }}
        run: python scanner/review.py --from-title "$TITLE"
      - name: Save results
        run: |
          git config user.name "rule-reviewer"
          git config user.email "rule-reviewer@users.noreply.github.com"
          git add data/rules.json index.html
          git diff --cached --quiet || (git commit -m "Review from dashboard" && git pull --rebase && git push)
      - name: Close the request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          OUTCOME: ${{ job.status }}
        run: |
          if [ "$OUTCOME" = "success" ]; then MSG="Done. Refresh the dashboard in a minute or two."; else MSG="Something went wrong. Open the Actions tab to see the error."; fi
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --comment "$MSG"
