name: Review an item

on:
  workflow_dispatch:
    inputs:
      item_ids:
        description: "Item id from the dashboard (several? separate with commas)"
        required: true
        type: string
      decision:
        description: "Approve or reject"
        required: true
        type: choice
        options:
          - approve
          - reject

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply decision
        env:
          IDS: ${{ inputs.item_ids }}
          DECISION: ${{ inputs.decision }}
        run: python scanner/review.py --ids "$IDS" --decision "$DECISION"
      - name: Save results
        env:
          DECISION: ${{ inputs.decision }}
        run: |
          git config user.name "rule-reviewer"
          git config user.email "rule-reviewer@users.noreply.github.com"
          git add data/rules.json index.html
          git diff --cached --quiet || (git commit -m "Review: $DECISION" && git pull --rebase && git push)
