name: Daily rule scan

on:
  schedule:
    # Weekdays at 11:17 UTC, after the Federal Register publishes each morning.
    - cron: "17 11 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r scanner/requirements.txt
      - name: Scan and tag new rules
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scanner/scan.py
      - name: Save results
        run: |
          git config user.name "rule-scanner"
          git config user.email "rule-scanner@users.noreply.github.com"
          git add data/rules.json index.html
          git diff --cached --quiet || (git commit -m "Daily rule scan" && git push)
